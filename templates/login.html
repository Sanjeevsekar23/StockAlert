
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockAlert</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #e8f5e9, #f4f7fb);
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(30, 60, 40, 0.12);
        }

        .brand-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #198754;
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        .brand-name {
            color: #198754;
            font-size: 29px;
            font-weight: 750;
            text-align: center;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #344054;
        }

        .form-control {
            min-height: 47px;
            border-radius: 9px;
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.12);
        }

        .signin-btn {
            min-height: 48px;
            border-radius: 9px;
            font-weight: 600;
            background: #198754;
            border: none;
        }

        .signin-btn:hover {
            background: #146c43;
        }

        .footer-text {
            margin-top: 24px;
            text-align: center;
            color: #89919b;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="login-card">

        <div class="brand-icon">S</div>

        <h1 class="brand-name">StockAlert</h1>

        <p class="subtitle">
            Smart Inventory &amp; Expiry Management
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-success signin-btn w-100">
                Sign In
            </button>

        </form>

        <p class="footer-text">
            Secure access for authorised staff
            <br>
            &copy; 2026 StockAlert
        </p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
